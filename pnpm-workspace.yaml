catalogMode: prefer
ignoreWorkspaceRootCheck: true
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
fetchTimeout: 180000
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js
  - cached-factory
  - memfs
  - semver
  - chokidar

packages:
  - docs
  - theme
  - cli
  - plugins/*
  - examples/*

overrides:
  '@bufbuild/protobuf': ^2.13.0
  '@shikijs/core': ^4.4.3
  '@shikijs/transformers': ^4.4.3
  '@shikijs/twoslash': ^4.4.3
  '@xmldom/xmldom': '>=0.9.10'
  axios: '>=1.19.0'
  baseline-browser-mapping: ^2.11.13
  brace-expansion: '>=5.0.9'
  chokidar: 'catalog:prod'
  dompurify: '>=3.4.13'
  esbuild: '>=0.28.2'
  fast-uri: '>=4.1.2'
  follow-redirects: '>=1.16.0'
  form-data: '>=4.0.6'
  linkify-it: '>=5.0.1'
  lodash: '>=4.18.1'
  lodash-es: '>=4.18.1'
  markdown-it: '>=14.2.0'
  mermaid: '>=11.16.1'
  postcss: '>=8.5.26'
  qs: '>=6.15.3'
  sass-embedded: 'catalog:peer'
  shell-quote: '>=1.10.0'
  simple-git: '>=3.36.0'
  tmp: '>=0.2.7'
  undici: '>=8.10.0'
  uuid: '>=14.0.1'
  vite: 'catalog:dev'
  vue: 'catalog:prod'
  vue-router: 'catalog:prod'
  ws: '>=8.21.3'

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  simple-git-hooks: true

patchedDependencies:
  floating-vue: patches/floating-vue.patch

