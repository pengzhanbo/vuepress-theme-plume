name: Test

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    name: unit-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # 各平台测试结果相互独立，不要因为某个平台失败而取消其他平台
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit Test
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run test

      - name: Upload coverage
        # 仅需上传一次覆盖率报告，避免多平台重复上传
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
