  undici: '>=8.10.2'
  uuid: '>=14.0.2'
  vite: 'catalog:dev'
  vue: 'catalog:prod'
  vue-router: 'catalog:prod'
  ws: '>=8.21.3'

patchedDependencies:
  floating-vue: patches/floating-vue.patch

allowBuilds:
