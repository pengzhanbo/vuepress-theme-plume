ignoreWorkspaceRootCheck: true
catalogMode: prefer

# minimumReleaseAge 单位为分钟，7200 = 5 天，与 renovate.json 的
# `minimumReleaseAge: "5 days"` 对齐，为 install 侧提供同一稳定期约束。
minimumReleaseAge: 7200
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@eslint/markdown@9.0.0'
  - '@pengzhanbo/eslint-config-vue@2.15.1'
  - '@pengzhanbo/eslint-config@2.15.1'
  - '@pengzhanbo/stylelint-config@2.15.1'
  - '@stylelint-types/stylelint-order@8.1.4'
  - '@stylelint-types/stylelint-scss@7.5.0'
  - '@stylelint-types/stylelint-stylistic@6.0.1'
  - '@stylistic/eslint-plugin@6.0.1'
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - eslint-plugin-jsdoc@65.4.10
  - eslint-plugin-perfectionist@5.14.0
  - eslint-plugin-unicorn@80.0.0
  - postcss-html@2.0.1

trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js
  - cached-factory
  - memfs
  - semver
  - chokidar
  - cpx2
  - undici-types

strictPeerDependencies: false
fetchTimeout: 180000
shamefullyHoist: true
shellEmulator: true

packages:
  - docs
  - theme
  - cli
  - plugins/*
  - examples/*

overrides:
  '@bufbuild/protobuf': ^2.17.0
  '@shikijs/core': ^4.6.0
  '@shikijs/transformers': ^4.6.0
  '@shikijs/twoslash': ^4.6.0
  '@xmldom/xmldom': '>=0.9.12'
  axios: '>=1.21.1'
  baseline-browser-mapping: ^2.11.37
  brace-expansion: '>=5.0.13'
  chokidar: 'catalog:prod'
  dompurify: '>=3.4.17'
  esbuild: '>=0.28.2'
  fast-uri: '>=4.2.3'
  follow-redirects: '>=1.16.3'
  form-data: '>=4.0.6'
  katex: '>=0.18.2'
  linkify-it: ^6.1.0
  lodash: '>=4.18.1'
  lodash-es: '>=4.18.1'
  markdown-it: ^15.0.3
  mermaid: '>=12.3.0'
  minimatch: '>=11.0.1'
  postcss: '>=8.5.33'
  qs: '>=6.17.1'
  sass-embedded: 'catalog:peer'
  shell-quote: '>=1.12.0'
  simple-git: '>=4.0.2'
  tmp: '>=0.2.7'
  undici: '>=8.12.4'
  uuid: '>=14.0.3'
  vite: 'catalog:dev'
  vue: 'catalog:prod'
  vue-router: 'catalog:prod'
